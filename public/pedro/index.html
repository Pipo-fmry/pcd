<script>

 {id:'poischiche',n:'Pois chiche',c:'fec',s:[],tip:'Mixé très finement, sans peau.'},
 // protéines

 {id:'poisson',n:'Poisson blanc',c:'pro',alg:'poisson',s:[],tip:'Vapeur, sans arêtes, mixé.'},
 {id:'saumon',n:'Saumon',c:'pro',alg:'poisson',s:[],tip:'Bien cuit, sans arêtes.'},
 {id:'oeuf',n:'Œuf',c:'pro',alg:'oeuf',s:[],tip:'Dur (10 min), blanc + jaune écrasés.'},
 // laitiers
 {id:'yaourt',n:'Yaourt nature',c:'lai',alg:'lait',s:[],tip:'Au lait entier, sans sucre.'},
 {id:'fromageblanc',n:'Fromage blanc',c:'lai',alg:'lait',s:[],tip:'Entier, sans sucre.'},
 {id:'beurre',n:'Beurre',c:'gra',s:[],tip:'Une noisette dans la purée.'},
 // arachide, fruits à coque & co
 {id:'arachide',n:'Arachide',c:'alg',alg:'arachide',s:[],tip:'Beurre de cacahuète 100 %, délayé. Jamais entier.'},
 {id:'amande',n:'Amande',c:'alg',alg:'amande',s:[],tip:'Poudre fine ou purée 100 %.'},
 {id:'noisette',n:'Noisette',c:'alg',alg:'noisette',s:[],tip:'Poudre ou purée 100 %.'},
 {id:'sesame',n:'Sésame (tahini)',c:'alg',alg:'sesame',s:[],tip:'Une pointe de purée de sésame.'},
 {id:'cajou',n:'Noix de cajou',c:'alg',alg:'cajou',s:[],tip:'Purée 100 %.'},
 {id:'noix',n:'Noix',c:'alg',alg:'noix',s:[],tip:'Poudre très fine.'},
 {id:'pistache',n:'Pistache',c:'alg',alg:'pistache',s:[],tip:'Purée 100 % ou poudre fine.'},
 {id:'soja',n:'Soja (tofu)',c:'alg',alg:'soja',s:[],tip:'Tofu soyeux écrasé.'},
 {id:'crevette',n:'Crevette',c:'alg',alg:'crustaces',s:[],tip:'Cuite, mixée.'},
 // matières grasses
 {id:'colza',n:'Huile de colza',c:'gra',s:[],tip:'1 c. à café rase dans la purée.'},
 {id:'olive',n:'Huile d\'olive',c:'gra',s:[],tip:'1 c. à café rase dans la purée.'},
];
const CATS = {leg:'Légumes',fru:'Fruits',fec:'Féculents',pro:'Viande, poisson, œuf',lai:'Laitiers',alg:'Arachide, fruits à coque & co',gra:'Matières grasses',aut:'Autres'};
// catégories proposées pour un aliment hors liste
const CAT_COURT = {leg:'Légume',fru:'Fruit',fec:'Féculent',pro:'Protéine',lai:'Laitier',gra:'Matière grasse',aut:'Autre'};
const FMAP = Object.fromEntries(FOODS.map(f=>[f.id,f]));
const WHO = ['Morgane','François','Sandrine'];

// groupes allergènes : target = prises par semaine pour l'entretien une fois toléré
const ALG = {
 lait:{n:'Lait',target:2}, oeuf:{n:'Œuf',target:2}, arachide:{n:'Arachide',target:3},
 ble:{n:'Blé',target:1}, poisson:{n:'Poisson',target:1}, amande:{n:'Amande',target:1},
 noisette:{n:'Noisette',target:1}, sesame:{n:'Sésame',target:1}, cajou:{n:'Cajou',target:1},
 noix:{n:'Noix',target:1}, pistache:{n:'Pistache',target:1}, soja:{n:'Soja',target:1}, crustaces:{n:'Crustacés',target:1},
};
const PRIORITAIRES = ['lait','oeuf','arachide'];
const ENT_FOOD = {lait:'yaourt',oeuf:'oeuf',ble:'semoule',arachide:'arachide',poisson:'poisson',amande:'amande'};

// dose de chaque prise d'introduction d'un allergène
const PROTO = {
 yaourt:['½ c. à café','1 c. à café','1 à 2 c. à café'],
 semoule:['¼ c. à café','½ c. à café','1 c. à café'],
 oeuf:['une pointe de cuillère','½ c. à café','1 c. à café'],
 arachide:['¼ c. à café délayée','½ c. à café','1 c. à café'],
 poisson:['une pointe de cuillère','½ c. à café','1 c. à café'],
 amande:['¼ c. à café','½ c. à café','1 c. à café'],
};

// programme des 8 premières semaines ; qt = repère de quantité (affiché seulement quand il change)
const PLAN = [
 {news:['courgette','brocoli'], alg:null, qt:'1 à 2 c. à café',
  know:['Il ouvre la bouche = il veut ; il détourne la tête = il a fini. Le lait reste l\'essentiel.','Avant 1 an, jamais : miel, sel, sucre ajouté, lait de vache en boisson.']},
 {news:['epinard','poireau'], alg:null, qt:'1 à 4 c. à café',
  know:['Refus ? Normal. On repropose 2-3 jours plus tard, jusqu\'à 10 fois.','Mangez du même légume devant lui.']},
 {news:['choufleur','navet'], alg:'yaourt', qt:'quelques c. à café + 1 c. à café d\'huile',
  know:['Rougeur autour de la bouche = souvent bénin. Plaques, gonflement, vomissements = on arrête et on appelle le médecin.','Gêne pour respirer, malaise, pâleur = 15.']},
 {news:['panais','carotte'], alg:'semoule', qt:'2 à 4 c. à soupe',
  know:['Gluten : petites quantités les premières semaines.']},
 {news:['pomme','potiron'], alg:'oeuf', qt:'60 à 100 g · fruit 1-2 c. à café',
  know:['Le fruit plutôt au goûter, séparé des légumes.','Œuf toujours bien cuit.']},
 {news:['poire','poulet'], alg:'arachide', qt:'60 à 100 g · viande 5 g',
  know:['Arachide et fruits à coque : jamais entiers avant 4 ans.','Viande, poisson, œuf : 5 g max par jour avant 6 mois.']},
 {news:['lentilles','patatedouce'], alg:'poisson', qt:'100 à 130 g',
  know:['Pas d\'espadon, requin, marlin ni poisson cru.','Fêtes : nouvel allergène seulement un jour à la maison.']},
 {news:['banane','boeuf','riz'], alg:'amande', qt:'130 à 150 g · viande 10 g dès 6 mois',
  know:['À 6 mois : textures plus épaisses, premiers morceaux s\'il tient assis seul.','Haut-le-cœur = réflexe normal. Vraie fausse route = silencieuse.']},
];
const AVIS = {aime:{e:'😋',n:'Aime'},bof:{e:'😐',n:'Mitigé'},refuse:{e:'🙅',n:'Refuse'}};
const REAC = {aucune:{n:'Aucune',cls:'g'},legere:{n:'Rougeur autour de la bouche',cls:''},surveiller:{n:'À surveiller',cls:'o'},serieuse:{n:'Sérieuse',cls:'r'}};
const estRx = e => e.reac==='surveiller' || e.reac==='serieuse';

/* ================= UTILITAIRES ================= */
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pd = s => { if(!s) return null; const [y,m,d]=String(s).split('-').map(Number); return new Date(y,m-1,d); };
const fd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const add = (d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const diff = (a,b)=>Math.round((pd(fd(b))-pd(fd(a)))/864e5);
const today = ()=>pd(fd(new Date()));
const frd = (d,o={day:'numeric',month:'short'})=>d.toLocaleDateString('fr-FR',o);
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const fname = id => FMAP[id]?FMAP[id].n:String(id).replace(/^autre:/,'');
// clé de comparaison : sans accents, parenthèses ni pluriel (« petit pois » = « Petits pois »)
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const cle = s => norm(String(s).replace(/\(.*?\)/g,'')).split(/[^a-z0-9]+/).filter(Boolean).map(w=>w.length>3?w.replace(/[sx]$/,''):w).join(' ');
function trouver(nom){
  const k=cle(nom); if(!k) return null;
  return FOODS.find(f=>cle(f.n)===k || f.n.split('/').some(p=>cle(p)===k)) || null;
}

/* ================= ALIMENTS HORS LISTE ================= */
// Pas de liste à part : ils se déduisent du journal (food = 'autre:<nom>', cat = catégorie choisie).
// Un aliment hors liste qui correspond à un aliment de la liste y est rattaché.
function customFood(id,n,c){
  const cat = (S.settings.cats||{})[id] || (CATS[c]&&c!=='alg'?c:'aut');
  if(FMAP[id]){ FMAP[id].c=cat; return FMAP[id]; }
  const f={id,n,c:cat,s:[],tip:'',custom:true};
  FOODS.push(f); FMAP[id]=f; return f;
}
function normEntry(e){
  if(!String(e.food).startsWith('autre:')) return e;
  const hit=trouver(e.foodName||e.food.slice(6));
  if(hit) return {...e,food:hit.id};
  customFood(e.food,e.foodName||e.food.slice(6),e.cat);
  return e;
}

/* ================= ÉTAT & STOCKAGE ================= */
const DEF = {start:'2026-11-09',pauses:[],extra:{},removed:{},swaps:{},cats:{}};
const S = {entries:[],settings:{...DEF}};
let DB=null;
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

async function initStore(){
  render();
  let db=null;
  try{ if(window.claude && window.claude.use) db = await window.claude.use('db'); }catch(e){ db=null; }
  if(!db){
    S.entries=LS.get('div_entries',[]).map(normEntry); S.settings={...DEF,...LS.get('div_settings',{})};
    render(); return;
  }
  DB=db;
  const lent=setTimeout(()=>alertBox('Connexion lente : les repas arrivent…'),10000);
  DB.collection('log').onSnapshot(snap=>{
    clearTimeout(lent);
    S.entries=snap.docs.map(d=>normEntry({id:d.id,...d.data()}));
    render();
  }, ()=>alertBox('Synchronisation impossible. Vérifiez la connexion.'));
  DB.doc('settings/baby').onSnapshot(s=>{
    if(s.exists) S.settings={...DEF,...s.data()};
    render();
  }, ()=>{});
}
async function addEntries(list){
  const ids=[];
  try{
    if(DB){ for(const e of list){ const r=await DB.collection('log').add(e); ids.push(r.id); } }
    else { for(const e of list){ const id='l'+Date.now()+Math.random().toString(36).slice(2,6); ids.push(id); S.entries.push(normEntry({id,...e})); } LS.set('div_entries',S.entries); render(); }
  }catch(err){ alertBox('Impossible d\'enregistrer. Réessayez.'); }
  return ids;
}
let toastTimer=null;
function toastUndo(ids,msg){
  document.querySelectorAll('.toast').forEach(x=>x.remove()); clearTimeout(toastTimer);
  if(!ids.length) return;
  const el=document.createElement('div'); el.className='toast';
  el.innerHTML=`<span>${esc(msg)}</span><button type="button" class="btn sm">Annuler</button>`;
  el.querySelector('button').onclick=async()=>{ el.remove(); for(const id of ids){ await delEntry(id); } };
  document.body.appendChild(el); toastTimer=setTimeout(()=>el.remove(),7000);
}
async function delEntry(id){
  try{
    if(DB) await DB.doc('log/'+id).delete();
    else { S.entries=S.entries.filter(e=>e.id!==id); LS.set('div_entries',S.entries); render(); }
  }catch(err){ alertBox('Suppression impossible.'); }
}
let saving=Promise.resolve();
function saveSettings(patch){
  S.settings={...S.settings,...patch}; render();
  const snap=JSON.parse(JSON.stringify(S.settings));
  saving=saving.then(async()=>{ try{ if(DB) await DB.doc('settings/baby').set(snap); else LS.set('div_settings',snap);}catch(e){ alertBox('Réglages non enregistrés.'); } });
}
function alertBox(msg){ const el=document.createElement('div'); el.className='warn alertbox'; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),4000); }

/* ================= ÉTAT DES ALIMENTS ================= */
// Calculs dérivés du journal mis en cache ; vidé à chaque rendu (toute écriture finit par un rendu)
let MEMO={};
const memo=(k,f)=>k in MEMO?MEMO[k]:(MEMO[k]=f());
const parDate=(a,b)=>(a.date+(a.ts||'')).localeCompare(b.date+(b.ts||''));
const entriesOf = id => memo('e:'+id, ()=>S.entries.filter(e=>e.food===id).sort(parDate));
const groupStat = g => memo('g:'+g, ()=>{
  const es=S.entries.filter(e=>(FMAP[e.food]||{}).alg===g).sort(parDate);
  const ok=es.filter(e=>!estRx(e)).length;
  const dates=es.map(e=>e.date).sort();
  return {n:es.length, ok, rx:es.length-ok, first:dates[0]||null, es};
});
const tolere = g => { const gs=groupStat(g); return gs.ok>=3 && !gs.rx; };
// recherche tolérante (accents, pluriel) dans le nom d'un aliment
const correspond = (f,q) => { const k=cle(q); return !!k && (cle(f.n).includes(k)||norm(f.n).includes(norm(q))); };
const compteEtats = () => { const nb={gout:0,cours:0,todo:0}; FOODS.forEach(f=>nb[stat(f.id).etat]++); return nb; };
// Un aliment est « goûté » (validé) après SEUIL jours où il a été accepté (😋 ou 😐) sans réaction ;
// un allergène après SEUIL prises sans réaction. Repère courant : quelques présentations sur des jours différents.
const SEUIL = 3;
// etat : gout (validé), cours (goûté sous le seuil, refusé, réaction), todo
// tag  : nuance pour la couleur du point — gout, enc (sous le seuil), alg (allergène en cours), ref, rx, todo
const stat = id => memo('s:'+id, ()=>{
  const es=entriesOf(id); const f=FMAP[id]||{};
  const n=es.length, aime=es.filter(e=>e.avis==='aime').length, refus=es.filter(e=>e.avis==='refuse').length;
  const acc=new Set(es.filter(e=>e.avis!=='refuse' && !estRx(e)).map(e=>e.date)).size; // jours acceptés
  const last=es[n-1]||null, lastRef=[...es].reverse().find(e=>e.avis==='refuse')||null;
  const gs=f.alg?groupStat(f.alg):null;
  const tag = es.some(estRx)||(gs&&gs.rx) ? 'rx' : gs ? (gs.ok>=SEUIL?'gout':gs.ok?'alg':'todo')
    : acc>=SEUIL ? 'gout' : acc ? 'enc' : n ? 'ref' : 'todo';
  const etat = tag==='gout'||tag==='todo' ? tag : 'cours';
  return {n,aime,refus,last,lastRef,etat,tag,ok:gs?gs.ok:acc};
});
// déjà accepté au moins une fois, sans réaction : peut revenir en reprise ou en remplacement
const accepte = s => s.tag==='gout' || s.tag==='enc';
const avisEmoji = s => s.last ? (AVIS[s.last.avis]||{e:''}).e : '';

/* ================= PROGRAMME ================= */
function schedule(){
  const st=pd(S.settings.start)||today(); const pauses=S.settings.pauses||[];
  const out=[]; let d=st;
  PLAN.forEach((p,i)=>{
    for(let k=0;k<pauses.filter(x=>x===i).length;k++){ out.push({pause:true,i,start:d}); d=add(d,7); }
    out.push({i,start:d}); d=add(d,7);
  });
  out.push({after:true,start:d});
  return out;
}
function slotAt(sch,date){
  if(date<sch[0].start) return null;
  for(const s of sch){
    if(s.after) return {after:true,start:add(s.start,7*Math.floor(diff(s.start,date)/7))}; // semaines glissantes après le programme
    if(date<add(s.start,7)) return s;
  }
  return null;
}
function weekFoods(i){
  const base=PLAN[i].news.filter(id=>!((S.settings.removed||{})[i]||[]).includes(id));
  const ex=((S.settings.extra||{})[i]||[]).filter(id=>!base.includes(id));
  return base.concat(ex);
}
function introWeek(id){ for(let i=0;i<PLAN.length;i++){ if(weekFoods(i).includes(id) || PLAN[i].alg===id) return i; } return -1; }
const DAYS_BY_WEEK = i => i<=1 ? [0,2,4,6] : i<=3 ? [0,1,3,4,6] : [0,1,2,3,4,5,6];
// reprises : semaine d'intro + 1 et + 2 = 1 fois, puis 1 fois toutes les 2 semaines
const REP_RULE = k => (k===1||k===2) ? 1 : (k>=4 && k%2===0) ? 1 : 0;
const semaineNormale = s => !!s && !s.pause && !s.after;
const slotKey = id => { const g=(FMAP[id]||{}).alg; return g?'g:'+g:'f:'+id; };
const matchKey = (e,k) => k.startsWith('g:') ? (FMAP[e.food]||{}).alg===k.slice(2) : e.food===k.slice(2);
const countIn = (k,from,to) => S.entries.filter(e=>matchKey(e,k) && e.date>=fd(from) && e.date<fd(to)).length;

// Objectifs d'une semaine. Les nouveautés et reprises se comptent dans la semaine ;
// l'allergène en cours se compte en prises restantes (3 au total), un seul à la fois.
function cibles(slot){
  const out=[]; const vu=new Set();
  const push=(id,n,kind,x={})=>{ const k=slotKey(id); if(vu.has(k)||!n) return; vu.add(k); out.push({id,k,n,kind,...x}); };
  const i=slot.after?PLAN.length-1:slot.i;
  if(semaineNormale(slot)){
    for(let j=0;j<=i;j++){ const a=PLAN[j].alg; if(!a) continue; const gs=groupStat(FMAP[a].alg); if(gs.rx||gs.ok>=3) continue; push(a,3-gs.ok,'alg',{net:true,deja:gs.ok}); break; }
    weekFoods(i).forEach(id=>{ if(stat(id).tag!=='rx') push(id,2,'new'); });
    for(let j=0;j<i;j++) weekFoods(j).forEach(id=>{ if(!stat(id).n) push(id,2,'new'); });
  }
  FOODS.forEach(f=>{ const s=stat(f.id); if(s.tag==='ref' && s.refus<10) push(f.id,1,'retry',{net:true,des:fd(add(pd(s.lastRef.date),2))}); });
  Object.keys(ALG).forEach(g=>{ if(!tolere(g)) return; push(ENT_FOOD[g]||FOODS.find(f=>f.alg===g).id, ALG[g].target,'ent'); });
  if(slot.pause || slot.after){
    FOODS.filter(f=>!f.alg && accepte(stat(f.id))).sort((a,b)=>stat(b.id).aime-stat(a.id).aime).slice(0,4).forEach(f=>push(f.id,1,'rep'));
  } else {
    for(let j=0;j<i;j++){ const n=REP_RULE(i-j); weekFoods(j).forEach(id=>{ if(accepte(stat(id))) push(id,n,'rep'); }); }
  }
  return out;
}

// Répartit ce qui reste à faire sur les jours restants de la semaine, à partir de `from`.
// Règles : un nouvel aliment par jour ; prise d'allergène seule nouveauté du jour, un jour sur deux si possible,
// 3 jours après la 1re prise d'un autre allergène ; pas la même reprise deux jours de suite ; 3 aliments max par jour.
// Ce qui a été noté compte, même hors programme ; ce qui manque glisse au jour suivant.
function planSemaine(slot, from){
  const ws=slot.start, we=add(ws,7);
  const avail = semaineNormale(slot) ? DAYS_BY_WEEK(slot.i) : [0,1,2,3,4,5,6];
  const swaps=S.settings.swaps||{};
  const T=cibles(slot);
  const jours=[];
  for(let d=0;d<7;d++){
    const date=add(ws,d); if(date<from) continue; const ds=fd(date);
    const faits=S.entries.filter(e=>e.date===ds); // journal du jour
    jours.push({date,ds,d,on:avail.includes(d)||faits.length>0,faits,items:[],sw:swaps[ds]||{skip:[],add:[]}});
  }
  T.forEach(t=>{ t.reste = t.net ? t.n : Math.max(0, t.n - countIn(t.k,ws,we)); });
  const nouveau = id => !stat(id).n;
  const nb = j => j.items.length + new Set(j.faits.map(e=>e.food)).size;
  const peut = (j,t) => j.on && nb(j)<3 && !j.items.some(it=>it.k===t.k) && !j.faits.some(e=>matchKey(e,t.k))
    && !j.sw.skip.includes(t.id) && (!t.des || j.ds>=t.des);
  const premiere = j => j.items.some(it=>it.first) || j.faits.some(e=>entriesOf(e.food)[0]?.id===e.id && !(FMAP[e.food]||{}).alg);
  const algDuJour = j => j.items.some(it=>it.kind==='alg') || j.faits.some(e=>(FMAP[e.food]||{}).alg && groupStat(FMAP[e.food].alg).ok<=3);
  const poser = (j,t,x={}) => { j.items.push({id:t.id,k:t.k,kind:t.kind,...x}); t.reste--; };
  // 1) ajouts manuels (« Remplacer »)
  jours.forEach(j=>j.sw.add.forEach(id=>{
    const k=slotKey(id); if(j.faits.some(e=>matchKey(e,k)) || j.items.some(it=>it.k===k)) return;
    const t=T.find(t=>t.k===k);
    j.items.push({id,k,kind:t?t.kind:'rep',manuel:true,first:nouveau(id),prise:t?.deja??0}); if(t) t.reste--;
  }));
  // 2) allergène en cours d'introduction
  const alg=T.find(t=>t.kind==='alg');
  if(alg && alg.reste>0){
    const g=FMAP[alg.id].alg; let min='';
    if(!groupStat(g).n){ const f=Object.keys(ALG).filter(x=>x!==g).map(x=>groupStat(x).first).filter(Boolean).sort().pop(); if(f) min=fd(add(pd(f),3)); }
    const cand=jours.filter(j=>peut(j,alg) && j.ds>=min && !premiere(j));
    let last=-9; const pris=[];
    cand.forEach(j=>{ if(alg.reste>pris.length && j.d-last>=2){ pris.push(j); last=j.d; } });
    cand.forEach(j=>{ if(alg.reste>pris.length && !pris.includes(j)) pris.push(j); });
    pris.forEach(j=>poser(j,alg));
    let prise=alg.deja; jours.forEach(j=>j.items.forEach(it=>{ if(it.k===alg.k) it.prise=prise++; })); // doses dans l'ordre des jours
  }
  // 3) nouveautés : première fois seule dans la journée (ni autre nouveauté ni allergène), 2e fois au plus tôt après
  T.filter(t=>t.kind==='new' && t.reste>0).forEach(t=>{
    const pose=jours.find(j=>j.items.some(it=>it.k===t.k));
    let apres=pose?pose.ds:'';
    if(nouveau(t.id) && !pose){
      const j=jours.find(j=>peut(j,t) && !premiere(j) && !algDuJour(j));
      if(!j) return; poser(j,t,{first:true}); apres=j.ds;
    }
    while(t.reste>0){ const j=jours.find(j=>j.ds>apres && peut(j,t)); if(!j) break; poser(j,t); apres=j.ds; }
  });
  // 4) entretien, refus à retenter, reprises : jour le moins chargé, pas deux jours de suite
  ['ent','retry','rep'].forEach(kind=>T.filter(t=>t.kind===kind).forEach(t=>{
    while(t.reste>0){
      const cand=jours.filter(j=>peut(j,t)); if(!cand.length) break;
      const voisin=j=>jours.some(x=>Math.abs(x.d-j.d)===1 && (x.items.some(it=>it.k===t.k)||x.faits.some(e=>matchKey(e,t.k))));
      cand.sort((a,b)=>(nb(a)*10+(voisin(a)?15:0)+a.d)-(nb(b)*10+(voisin(b)?15:0)+b.d));
      poser(cand[0],t);
    }
  }));
  return jours;
}
// Les 7 prochains jours (à partir du début du programme s'il n'a pas commencé)
const prochainsJours = () => memo('jours', ()=>{
  const sch=schedule(); const t=today(); const from = t<sch[0].start ? sch[0].start : t;
  const plans=new Map(); const out=[];
  for(let k=0;k<7;k++){
    const date=add(from,k), ds=fd(date), slot=slotAt(sch,date), sem=fd(slot.start)+(slot.pause?'p':'');
    if(!plans.has(sem)) plans.set(sem, planSemaine(slot, slot.start<from?from:slot.start));
    const j=plans.get(sem).find(x=>x.ds===ds);
    if(j) out.push({...j,slot});
  }
  return out;
});
function observing(){
  const now=Date.now(); const out=[];
  Object.keys(ALG).forEach(g=>{
    groupStat(g).es.slice(0,3).forEach(e=>{
      if(!e.ts) return; const until=new Date(e.ts).getTime()+2*3600e3;
      if(until>now && e.date===fd(today())) out.push({e,until});
    });
  });
  return out;
}

}
function majSwapRecherche(q){
  const el=document.getElementById('sqres'); const k=cle(q);
  el.innerHTML = k ? FOODS.filter(f=>f.id!==SWAP.id && correspond(f,q)).slice(0,6).map(f=>{ const s=stat(f.id);
    return `<button type="button" class="ligne-main" data-swapto="${esc(f.id)}"><span class="nm">${esc(f.n)}</span>${f.alg?'<span class="pill butter">allergène</span>':!s.n?'<span class="pill sage">nouveau</span>':`<span class="em">${avisEmoji(s)}</span>`}</button>`; }).join('') : '';
}
function appliquerSwap(to){
  const {id,ds}=SWAP; const td=fd(today());
  const swaps=Object.fromEntries(Object.entries(S.settings.swaps||{}).filter(([d])=>d>=td));
  const sw={skip:[...(swaps[ds]?.skip||[])],add:[...(swaps[ds]?.add||[])]};
  if(sw.add.includes(id)) sw.add=sw.add.filter(x=>x!==id); else if(!sw.skip.includes(id)) sw.skip.push(id);
  if(to){ sw.add.push(to); sw.skip=sw.skip.filter(x=>x!==to); }
  swaps[ds]=sw; closeModal(); saveSettings({swaps});
}

/* ---------- Programme (8 semaines, éditable) ---------- */
const OPENW=new Set();
function setWeekFood(st,i,id,present){
  const inBase=PLAN[i].news.includes(id);
  st.removed[i]=(st.removed[i]||[]).filter(x=>x!==id);
  st.extra[i]=(st.extra[i]||[]).filter(x=>x!==id);
  if(present && !inBase) st.extra[i].push(id);
  if(!present && inBase) st.removed[i].push(id);
}
function editFoods(fn){
  const st={removed:JSON.parse(JSON.stringify(S.settings.removed||{})),extra:JSON.parse(JSON.stringify(S.settings.extra||{}))};
  fn(st); saveSettings(st); if(mbg.classList.contains('show')) drawProg();
}
function openProg(){ FEUILLE=null; const sl=slotAt(schedule(),today()); if(sl&&sl.i!==undefined) OPENW.add(sl.i); drawProg(); showModal(); }
function drawProg(){
  const sch=schedule(); const t=today(); const cur=sch.findIndex(x=>t>=x.start && (x.after||t<add(x.start,7)));
  const planned=new Set(); PLAN.forEach((p,i)=>weekFoods(i).forEach(id=>planned.add(id)));
  const rel=k=>{ const d=cur<0?k+ (t<sch[0].start?Math.ceil(diff(t,sch[0].start)/7):0) : k-cur; return d<0?'Passée':d===0?'Cette semaine':d===1?'Semaine prochaine':`Dans ${d} semaines`; };
  let html=tete('Le programme');
  sch.forEach((x,k)=>{
    if(x.after) return;
    if(x.pause){ html+=`<div class="sem pause"><span><span class="kicker">${rel(k)}</span><br><b>Pause</b> <span class="note">aliments connus</span></span><button type="button" class="btn sm ghost" data-unpause="${x.i}">Retirer</button></div>`; return; }
    const i=x.i, p=PLAN[i], foods=weekFoods(i);
    const fini=foods.every(id=>stat(id).n) && (!p.alg || groupStat(FMAP[p.alg].alg).ok>=3);
    const editRows=foods.map(id=>`<div class="ligne"><span class="nm">${esc(fname(id))}</span>
        <button type="button" class="btn sm ghost" data-mv="${i}" data-dir="-1" data-id="${id}" ${i===0?'disabled':''} aria-label="Semaine d'avant">◀</button>
        <button type="button" class="btn sm ghost" data-mv="${i}" data-dir="1" data-id="${id}" ${i===PLAN.length-1?'disabled':''} aria-label="Semaine d'après">▶</button>
        <button type="button" class="btn sm ghost" data-wrm="${i}" data-id="${id}" aria-label="Retirer">✕</button></div>`).join('');
    const addSel=`<select data-wadd="${i}" aria-label="Ajouter un aliment"><option value="">＋ Ajouter un aliment</option>${Object.entries(CATS).filter(([c])=>c!=='alg'&&c!=='aut').map(([c,cn])=>`<optgroup label="${esc(cn)}">${FOODS.filter(f=>f.c===c&&!f.alg&&!foods.includes(f.id)).map(f=>`<option value="${f.id}">${esc(f.n)}${planned.has(f.id)?' (sem. '+(introWeek(f.id)+1)+')':''}</option>`).join('')}</optgroup>`).join('')}</select>`;
    html+=`<details class="sem${k===cur?' now':''}" data-w="${i}" ${OPENW.has(i)?'open':''}><summary>
      <span class="g"><span class="kicker">${rel(k)}</span><br><b>${foods.map(fname).map(esc).join(', ')||'Aucune nouveauté'}</b>${p.alg?` <span class="pill butter">${esc(ALG[FMAP[p.alg].alg].n)}</span>`:''}</span>${fini?'<span class="ok-ic">✓</span>':''}</summary>
      <div class="in">${editRows}${addSel}
        <details class="savoir"><summary>Bon à savoir</summary><ul class="tight">${p.know.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></details>
        ${k>=cur?`<button type="button" class="btn sm ghost" data-pause="${i}">⏸ Pause d'une semaine avant</button>`:''}
      </div></details>`;
  });
  modal.innerHTML=html;
}
function moveFood(i,id,dir){ const j=i+dir; if(j<0||j>=PLAN.length) return; OPENW.add(i); OPENW.add(j); editFoods(st=>{ setWeekFood(st,i,id,false); setWeekFood(st,j,id,true); }); }
function weekRemove(i,id){ OPENW.add(i); editFoods(st=>setWeekFood(st,i,id,false)); }
function weekAdd(i,id){ if(!id) return; OPENW.add(i); editFoods(st=>{ const w=introWeek(id); if(w>-1 && w!==i) setWeekFood(st,w,id,false); setWeekFood(st,i,id,true); }); }

/* ---------- Noter un repas ---------- */
let F={};
function openLog(preset, date){
  FEUILLE=null;
  const who=LS.get('div_who','');
  F={foods:new Set(preset?[preset]:[]), date:date||fd(today()), avis:'', reac:'aucune', note:'', q:'', newName:'',
     who: WHO.includes(who)?who:(who?'Autre':''), whoAutre: WHO.includes(who)?'':who};
  drawLog(); showModal();
}
function prevusLe(ds){ const j=prochainsJours().find(x=>x.ds===ds); return j?j.items.map(it=>it.id):[]; }
function drawLog(){
  const chipsIds=[...new Set([...prevusLe(F.date),...F.foods])];
  const nouvelAlg=[...F.foods].some(id=>{ const g=(FMAP[id]||{}).alg; return g && groupStat(g).n===0; });
  modal.innerHTML=tete('Noter un repas')+`
   <div class="fld ligne-date"><label for="date">Jour</label><input type="date" id="date" value="${F.date}"></div>
   <div class="fld"><span class="lab">Aliments</span>
     ${chipsIds.length?`<div class="filter">${chipsIds.map(id=>`<button type="button" class="chip ${F.foods.has(id)?'on g':''}" data-food="${esc(id)}" aria-pressed="${F.foods.has(id)}">${F.foods.has(id)?'✓ ':''}${esc(fname(id))}</button>`).join('')}</div>`:''}
     <input type="search" id="q" class="recherche" placeholder="Chercher ou ajouter un aliment" value="${esc(F.q)}" autocomplete="off" enterkeyhint="done">
     <div id="qres" class="qres"></div></div>
   ${nouvelAlg?'<div class="info">Nouvel allergène : le matin ou le midi, à la maison. Observez Pedro 2 heures.</div>':''}
   <div class="fld"><span class="lab">Son avis</span><div class="avis">${Object.entries(AVIS).map(([k,v])=>`<button type="button" class="${F.avis===k?'on':''}" data-avis="${k}" aria-pressed="${F.avis===k}"><span>${v.e}</span>${esc(v.n)}</button>`).join('')}</div></div>
   <div class="fld"><label for="who">Donné par</label><select id="who"><option value="">Choisir</option>${[...WHO,'Autre'].map(w=>`<option ${F.who===w?'selected':''}>${w}</option>`).join('')}</select>
     ${F.who==='Autre'?`<input type="text" id="whoAutre" placeholder="Prénom" value="${esc(F.whoAutre)}" style="margin-top:8px">`:''}</div>
   <details class="plus" ${F.reac!=='aucune'||F.note?'open':''}><summary>Réaction, note</summary>
     <div class="fld"><span class="lab">Réaction</span><div class="filter">${Object.entries(REAC).map(([k,v])=>`<button type="button" class="chip ${F.reac===k?'on '+v.cls:''}" data-reac="${k}">${esc(v.n)}</button>`).join('')}</div>
       ${F.reac==='serieuse'?'<div class="warn"><b>Arrêtez cet aliment et contactez votre médecin.</b> Gêne pour respirer, malaise, pâleur : 15.</div>':''}
       ${F.reac==='surveiller'?'<div class="warn">Ne reproposez pas cet aliment avant d\'en avoir parlé au médecin. Une photo peut aider.</div>':''}</div>
     <div class="fld"><label for="note">Note</label><textarea id="note" placeholder="Préparation, mélange…">${esc(F.note)}</textarea></div>
   </details>
   <div class="sheet-foot"><button type="button" class="btn big" id="saveLog">Enregistrer</button></div>`;
  majRecherche();
}
function majRecherche(){
  const el=document.getElementById('qres'); if(!el) return;
  const q=cle(F.q);
  if(F.newName){
    el.innerHTML=`<p class="note">« ${esc(F.newName)} » est un…</p><div class="filter">${Object.entries(CAT_COURT).map(([c,n])=>`<button type="button" class="chip" data-newcat="${c}">${esc(n)}</button>`).join('')}</div>`;
    return;
  }
  if(!q){ el.innerHTML=''; return; }
  const res=FOODS.filter(f=>!F.foods.has(f.id) && correspond(f,F.q)).slice(0,6);
  const exact=trouver(F.q);
  el.innerHTML=res.map(f=>`<button type="button" class="ligne-main" data-pick="${esc(f.id)}"><span class="nm">${esc(f.n)}</span><span class="meta">${esc(CATS[f.c]||'')}</span></button>`).join('')
    + (exact?'':`<button type="button" class="ligne-main ajout" data-new><span class="nm">＋ Ajouter « ${esc(F.q.trim())} »</span></button>`);
}
function captureLog(){
  const g=id=>document.getElementById(id);
  if(!g('date')) return;
  F.date=g('date').value||F.date; F.note=g('note').value; F.who=g('who').value; F.q=g('q').value;
  if(g('whoAutre')) F.whoAutre=g('whoAutre').value;
}
async function saveLog(){
  captureLog();
  const list=[...F.foods];
  if(!list.length){ alertBox('Choisissez au moins un aliment.'); return; }
  if(!F.avis){ alertBox('Choisissez son avis.'); return; }
  const who=(F.who==='Autre'?F.whoAutre:F.who).trim().slice(0,40);
  LS.set('div_who',who);
  const avis=F.avis;
  const base={date:F.date,avis,reac:F.reac,note:F.note.trim().slice(0,500),who,ts:new Date().toISOString()};
  const items=list.map(id=>({...base,food:id,foodName:fname(id),...(FMAP[id]?.custom?{cat:FMAP[id].c}:{})}));
  closeModal();
  const ids=await addEntries(items);
  toastUndo(ids, items.length>1?`${items.length} aliments notés`:`${items[0].foodName} noté ${AVIS[avis].e}`);
}

/* ================= ÉVÉNEMENTS ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a,summary'); if(!t) return;
  const d=t.dataset;
  if(t.matches('#tabs a')){ e.preventDefault(); TAB=d.t; try{history.replaceState(null,'','#'+TAB)}catch(_){location.hash=TAB} render(); window.scrollTo(0,0); return; }
  if(d.ff){ e.preventDefault(); FF=d.ff; render(); return; }
  if(t.id==='fab'){ openLog(null); return; }
  if(t.id==='openProg'){ openProg(); return; }
  if(t.hasAttribute('data-close')){ closeModal(); return; }
  if(d.log!==undefined){ openLog(d.log||null, d.date && d.date<fd(today()) ? d.date : undefined); return; }
  if(d.fiche){ openFiche(d.fiche); return; }
  if(d.swap){ openSwap(d.swap,d.date); return; }
  if(d.swapto!==undefined){ appliquerSwap(d.swapto); return; }
  if(d.reset){ const swaps={...(S.settings.swaps||{})}; delete swaps[d.reset]; saveSettings({swaps}); return; }
  if(d.cat){ saveSettings({cats:{...(S.settings.cats||{}),[FICHE]:d.cat}}); drawFiche(); return; }
  // Noter un repas
  if(d.food){ captureLog(); F.foods.has(d.food)?F.foods.delete(d.food):F.foods.add(d.food); drawLog(); return; }
  if(d.pick){ captureLog(); F.foods.add(d.pick); F.q=''; drawLog(); document.getElementById('q').focus(); return; }
  if(t.hasAttribute('data-new')){ captureLog(); F.newName=F.q.trim().slice(0,60); majRecherche(); return; }
  if(d.newcat){ captureLog(); const id='autre:'+F.newName.toLowerCase(); customFood(id,F.newName,d.newcat); F.foods.add(id); F.newName=''; F.q=''; drawLog(); return; }
  if(d.avis){ captureLog(); F.avis=d.avis; drawLog(); return; }
  if(d.reac){ captureLog(); F.reac=d.reac; drawLog(); return; }
  if(t.id==='saveLog'){ saveLog(); return; }
  // Programme
  if(d.mv!==undefined){ if(!t.disabled) moveFood(+d.mv,d.id,+d.dir); return; }
  if(d.wrm!==undefined){ weekRemove(+d.wrm,d.id); return; }
  if(d.pause!==undefined){ saveSettings({pauses:[...(S.settings.pauses||[]),+d.pause]}); drawProg(); return; }
  if(d.unpause!==undefined){ const p=[...(S.settings.pauses||[])]; const k=p.indexOf(+d.unpause); if(k>-1)p.splice(k,1); saveSettings({pauses:p}); drawProg(); return; }
  // Suppression d'un repas : double appui
  if(d.del){ if(d.armed){ delEntry(d.del); } else { d.armed='1'; t.textContent='Supprimer ?'; t.classList.add('arme'); setTimeout(()=>{ if(t.isConnected){ delete t.dataset.armed; t.textContent='✕'; t.classList.remove('arme'); } },3000); } return; }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset && t.dataset.wadd!==undefined){ weekAdd(+t.dataset.wadd,t.value); }
  if(t.id==='who'){ captureLog(); drawLog(); if(F.who==='Autre') document.getElementById('whoAutre').focus(); }
  if(t.id==='date'){ captureLog(); drawLog(); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ F.q=e.target.value; F.newName=''; majRecherche(); }
  if(e.target.id==='fq'){ FQ=e.target.value; document.getElementById('fres').innerHTML=listeAliments(); }
  if(e.target.id==='sq') majSwapRecherche(e.target.value);
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter' || e.target.id!=='q') return;
  e.preventDefault(); captureLog();
  const first=document.querySelector('#qres [data-pick]');
  if(first){ F.foods.add(first.dataset.pick); F.q=''; drawLog(); }
  else if(F.q.trim()){ F.newName=F.q.trim().slice(0,60); majRecherche(); }
});
document.addEventListener('toggle',e=>{ const d=e.target; if(d.matches && d.matches('details.sem[data-w]')){ const i=+d.dataset.w; d.open?OPENW.add(i):OPENW.delete(i); } },true);
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(TABS.includes(h) && h!==TAB){ TAB=h; render(); } });
setInterval(()=>{ if(TAB==='semaine' && observing().length && !mbg.classList.contains('show')) render(); },60000);
initStore();
</script>
