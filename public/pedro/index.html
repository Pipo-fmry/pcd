<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedro · PCD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F8E8; --card:#FFFFFF; --ink:#330F0A; --muted:#6B6F5E; --line:#E3E6CF;
  --sage:#65743A; --sage-l:#E9EEDA; --peach:#B8923A; --peach-l:#F7EFCF;
  --butter:#EFDD8D; --red:#A8402E; --red-l:#F6E0DA; --blue:#394F49; --blue-l:#E1E9E6;
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16.5px}
.wrap{max-width:860px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(170px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:14px}
.sync{font-size:12px;color:var(--muted);padding:3px 9px;border:1px solid var(--line);border-radius:99px;background:#fff;white-space:nowrap}
nav.tabs{display:flex;gap:4px;margin:18px 0 14px;background:#E3E6CF;padding:4px;border-radius:12px;overflow-x:auto}
nav.tabs a{flex:1;text-align:center;padding:8px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px;white-space:nowrap}
nav.tabs a.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.soft{background:#FBFCF3}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 9px;border-radius:99px;background:#ECEFDC;color:var(--ink);white-space:nowrap}
.pill.sage{background:var(--sage-l);color:#3F4A22}.pill.peach{background:var(--peach-l);color:#6E5414}
.pill.red{background:var(--red-l);color:var(--red)}.pill.blue{background:var(--blue-l);color:var(--blue)}
.pill.butter{background:var(--butter);color:#6E5414}
.btn{font:inherit;font-weight:600;border:0;border-radius:11px;padding:10px 14px;cursor:pointer;background:var(--ink);color:#fff}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent;color:var(--muted);border:0;padding:6px 8px;font-weight:500}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 6px 20px rgba(51,15,10,.25);padding:14px 18px;border-radius:99px;font-size:15px}
.weekhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:10px}
.food{border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:4px}
.food:hover{border-color:#C9CFA8}
.food .nm{font-weight:600}
.food .st{font-size:12.5px;color:var(--muted)}
.food.done{background:var(--sage-l);border-color:#C5CFA0}
.food.ref{background:var(--peach-l);border-color:#E8DBA6}
.food.rx{background:var(--red-l);border-color:#E6C2B8}
.alg{border:1px solid #E0CD7A;background:#FBF6DF;border-radius:12px;padding:12px;margin-top:10px}
.alg ol{margin:6px 0 4px 18px;padding:0}
.alg li{margin:2px 0}
.steps{display:flex;gap:6px;margin-top:6px}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid #E0CD7A;display:grid;place-items:center;font-size:12px;font-weight:600;color:#8D7430;background:#fff}
.dot.ok{background:var(--sage);border-color:var(--sage);color:#fff}
.dot.rx{background:var(--red);border-color:var(--red);color:#fff}
.note{font-size:13.5px;color:var(--muted)}
ul.tight{margin:6px 0 0 18px;padding:0} ul.tight li{margin:3px 0}
.progress{display:flex;gap:4px;margin-top:10px}
.progress span{flex:1;height:6px;border-radius:9px;background:#E3E6CF}
.progress span.past{background:#C5CFA0}.progress span.now{background:var(--sage)}
.progress span.pause{background:repeating-linear-gradient(45deg,#E3E6CF,#E3E6CF 3px,#fff 3px,#fff 6px)}
details.week{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
details.week>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
details.week>summary::-webkit-details-marker{display:none}
details.week[open]>summary{border-bottom:1px solid var(--line)}
details.week .in{padding:4px 14px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.maint{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);gap:8px}
.maint:last-child{border-bottom:0}
.bar{display:flex;gap:3px}.bar i{width:16px;height:8px;border-radius:4px;background:#E3E6CF;display:block}.bar i.on{background:var(--sage)}
.log{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.log:last-child{border-bottom:0}
.log .em{font-size:20px;width:28px;text-align:center}
.log .meta{font-size:12.5px;color:var(--muted)}
.dayh{font-weight:600;margin:14px 0 2px;font-size:13px;color:var(--muted);text-transform:capitalize}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font:inherit;font-size:13.5px;padding:7px 11px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.on.g{background:var(--sage);border-color:var(--sage)}
.chip.on.o{background:var(--peach);border-color:var(--peach)}
.chip.on.r{background:var(--red);border-color:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(51,15,10,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 22px}
@media (min-width:700px){.modal-bg{align-items:center}.modal{border-radius:20px}}
.fld{margin-top:14px}
.fld>label,.lab{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px}
input[type=text],input[type=date],textarea,select{font:inherit;width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:60px;resize:vertical}
.warn{background:var(--red-l);color:#7A2E22;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.info{background:var(--blue-l);color:#2A3B36;border-radius:12px;padding:10px 12px;font-size:14px}
.ok{background:var(--sage-l);color:#3F4A22;border-radius:12px;padding:10px 12px;font-size:14px}
.prose h3{margin:18px 0 6px}.prose p{margin:6px 0}.prose ul{margin:6px 0 6px 18px;padding:0}.prose li{margin:3px 0}
table.q{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.q td,table.q th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.q th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.check{display:flex;gap:9px;align-items:flex-start;padding:5px 0;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--sage);width:17px;height:17px}
.muted{color:var(--muted)}
.hide{display:none!important}
a{color:var(--blue)}
.sea{font-size:11px;color:#3F4A22}
.foodpick{display:flex;flex-wrap:wrap;gap:6px;max-height:210px;overflow:auto;padding:2px}
.empty{color:var(--muted);text-align:center;padding:24px 8px}

/* Barre d'onglets PCD */
.pcd-tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:45;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pcd-tabbar nav{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.pcd-tabbar a{display:grid;justify-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;padding:4px 0;font-family:Inter,system-ui,sans-serif}
.pcd-tabbar a .i{font-size:22px;line-height:1}
.pcd-tabbar a[aria-current="page"]{color:var(--sage)}
.modal-bg{z-index:50}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="title">La diversification de bébé</h1>
      <div class="sub" id="agebar">…</div>
    </div>
    <div class="row">
      <span class="sync" id="sync">Connexion…</span>
      <button class="btn ghost" id="openSettings" title="Réglages">⚙︎ Réglages</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <a href="#aujourdhui" data-t="aujourdhui">Aujourd'hui</a>
    <a href="#planning" data-t="planning">Planning</a>
    <a href="#aliments" data-t="aliments">Aliments</a>
  </nav>

  <main id="view"></main>
</div>

<button class="btn fab" id="fab">＋ Noter un repas</button>

<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>

<div class="pcd-tabbar"><nav>
  <a href="/#accueil"><span class="i">⌂</span>Accueil</a>
  <a href="/#cinema"><span class="i">🎬</span>Cinéma</a>
  <a href="/pedro/" aria-current="page"><span class="i">🐦</span>Pedro</a>
  <a href="/#livres"><span class="i">📚</span>Livres</a>
</nav></div>
<script src="/pedro/shim.js"></script>
<script>
/* ================= DONNÉES ================= */
// saisons : mois (1-12) où l'aliment est de saison à Marseille ; [] = toujours disponible
const FOODS = [
 // légumes
 {id:'courgette',n:'Courgette',c:'leg',s:[5,6,7,8,9,10,11],tip:'Sans peau ni pépins, cuite vapeur, mixée. Fin de saison sur le marché.'},
 {id:'brocoli',n:'Brocoli',c:'leg',s:[10,11,12,1,2,3],tip:'Les fleurettes, bien cuites, mixées.'},
 {id:'epinard',n:'Épinard',c:'leg',s:[10,11,12,1,2,3,4],tip:'Frais : équeuté, bien cuit, mixé finement. Surgelé nature possible.'},
 {id:'poireau',n:'Poireau (blanc)',c:'leg',s:[9,10,11,12,1,2,3,4],tip:'Uniquement le blanc, bien cuit.'},
 {id:'choufleur',n:'Chou-fleur',c:'leg',s:[10,11,12,1,2,3,4],tip:'Fleurettes bien cuites.'},
 {id:'navet',n:'Navet',c:'leg',s:[10,11,12,1,2,3],tip:'Petit navet nouveau, épluché.'},
 {id:'panais',n:'Panais',c:'leg',s:[10,11,12,1,2,3],tip:'Goût doux, légèrement sucré.'},
 {id:'carotte',n:'Carotte',c:'leg',s:[],tip:'Légume sucré : arrive après les verts.'},
 {id:'potiron',n:'Potiron / butternut',c:'leg',s:[9,10,11,12,1,2],tip:'Sucré et onctueux.'},
 {id:'patatedouce',n:'Patate douce',c:'leg',s:[9,10,11,12,1],tip:'Sucrée, très bien acceptée. En bâtonnets fondants dès 6 mois.'},
 {id:'pdt',n:'Pomme de terre',c:'leg',s:[],tip:'Peut servir de liant pour épaissir n\'importe quelle purée.'},
 {id:'blette',n:'Blette',c:'leg',s:[10,11,12,1,2,3,4,5],tip:'Le vert, bien cuit. Très provençal.'},
 {id:'fenouil',n:'Fenouil',c:'leg',s:[10,11,12,1,2,3,4],tip:'Cuit et mixé, goût anisé doux.'},
 {id:'betterave',n:'Betterave',c:'leg',s:[9,10,11,12,1,2,3],tip:'Cuite. Colore les couches, c\'est normal !'},
 {id:'endive',n:'Endive (cuite)',c:'leg',s:[10,11,12,1,2,3],tip:'Amère : bon entraînement du goût.'},
 {id:'haricotvert',n:'Haricot vert (surgelé)',c:'leg',s:[],tip:'Surgelé nature : bonne option hors saison.'},
 {id:'avocat',n:'Avocat',c:'leg',s:[11,12,1,2,3,4,5],tip:'Bien mûr, écrasé, cru.'},
 // fruits
 {id:'pomme',n:'Pomme (cuite)',c:'fru',s:[9,10,11,12,1,2,3,4],tip:'Compote maison sans sucre. Jamais crue dure en morceaux.'},
 {id:'poire',n:'Poire',c:'fru',s:[9,10,11,12,1,2],tip:'Cuite au début, puis crue très mûre écrasée.'},
 {id:'banane',n:'Banane',c:'fru',s:[],tip:'Bien mûre, écrasée.'},
 {id:'clementine',n:'Clémentine',c:'fru',s:[11,12,1,2],tip:'Quelques quartiers pressés dans une compote.'},
 {id:'kiwi',n:'Kiwi',c:'fru',s:[11,12,1,2,3,4],tip:'Acide : en petite quantité dans une compote.'},
 {id:'kaki',n:'Kaki (bien mûr)',c:'fru',s:[10,11,12],tip:'Très mûr, à la cuillère.'},
 // féculents
 {id:'semoule',n:'Semoule de blé',c:'fec',alg:'ble',s:[],tip:'Semoule fine cuite dans l\'eau des légumes.'},
 {id:'riz',n:'Riz',c:'fec',s:[],tip:'Bien cuit, mixé avec les légumes.'},
 {id:'avoine',n:'Flocons d\'avoine',c:'fec',s:[],tip:'Contiennent du gluten. Cuits dans de l\'eau ou du lait de bébé.'},
 {id:'quinoa',n:'Quinoa',c:'fec',s:[],tip:'Bien rincé et cuit.'},
 {id:'lentilles',n:'Lentilles corail',c:'fec',s:[],tip:'Très cuites, mixées. 1 c. à café au début.'},
 {id:'poischiche',n:'Pois chiche',c:'fec',s:[],tip:'Mixé très finement, sans peau.'},
 // protéines
 {id:'poulet',n:'Poulet',c:'pro',s:[],tip:'Bien cuit, mixé. 5 g max/jour avant 6 mois, 10 g après.'},
 {id:'dinde',n:'Dinde',c:'pro',s:[],tip:'Bien cuite, mixée.'},
 {id:'boeuf',n:'Bœuf',c:'pro',s:[],tip:'Riche en fer. Bien cuit, mixé.'},
 {id:'veau',n:'Veau',c:'pro',s:[],tip:'Bien cuit, mixé.'},
 {id:'poisson',n:'Poisson blanc',c:'pro',alg:'poisson',s:[],tip:'Cabillaud, colin, lieu : vapeur, sans arêtes, mixé.'},
 {id:'saumon',n:'Saumon',c:'pro',alg:'poisson',s:[],tip:'Poisson gras, bien cuit, sans arêtes.'},
 {id:'oeuf',n:'Œuf (bien cuit)',c:'pro',alg:'oeuf',s:[],tip:'Œuf dur 10 min, blanc + jaune écrasés.'},
 // laitiers
 {id:'yaourt',n:'Yaourt nature',c:'lai',alg:'lait',s:[],tip:'Au lait entier, sans sucre.'},
 {id:'fromageblanc',n:'Fromage blanc nature',c:'lai',alg:'lait',s:[],tip:'Entier, sans sucre.'},
 {id:'beurre',n:'Beurre',c:'gra',s:[],tip:'Une noisette dans la purée.'},
 // allergènes « fruits à coque & co »
 {id:'arachide',n:'Arachide',c:'alg',alg:'arachide',s:[],tip:'Beurre de cacahuète 100 %, lisse, délayé. Jamais entier.'},
 {id:'amande',n:'Amande',c:'alg',alg:'amande',s:[],tip:'Poudre fine ou purée 100 %, dans une compote.'},
 {id:'noisette',n:'Noisette',c:'alg',alg:'noisette',s:[],tip:'Poudre ou purée 100 %.'},
 {id:'sesame',n:'Sésame (tahini)',c:'alg',alg:'sesame',s:[],tip:'Purée de sésame, une pointe dans la purée.'},
 {id:'cajou',n:'Noix de cajou',c:'alg',alg:'cajou',s:[],tip:'Purée 100 %.'},
 {id:'noix',n:'Noix',c:'alg',alg:'noix',s:[],tip:'Poudre très fine.'},
 {id:'pistache',n:'Pistache',c:'alg',alg:'pistache',s:[],tip:'Purée 100 % ou poudre fine.'},
 {id:'soja',n:'Soja (tofu)',c:'alg',alg:'soja',s:[],tip:'Tofu soyeux écrasé.'},
 {id:'crevette',n:'Crevette',c:'alg',alg:'crustaces',s:[],tip:'Cuite, mixée.'},
 // matières grasses
 {id:'colza',n:'Huile de colza',c:'gra',s:[],tip:'1 c. à café rase dans la purée (oméga-3).'},
 {id:'olive',n:'Huile d\'olive',c:'gra',s:[],tip:'1 c. à café rase dans la purée.'},
];
const CATS = {leg:'Légumes',fru:'Fruits',fec:'Féculents & légumineuses',pro:'Viande, poisson, œuf',lai:'Produits laitiers',alg:'Arachide, fruits à coque & co',gra:'Matières grasses'};
const FMAP = Object.fromEntries(FOODS.map(f=>[f.id,f]));

// groupes allergènes : tier 1 = prioritaires (2-3×/sem), tier 2 = 1×/sem minimum
const ALG = {
 lait:{n:'Lait (yaourt)',tier:1,target:2},
 oeuf:{n:'Œuf',tier:1,target:2},
 arachide:{n:'Arachide',tier:1,target:3},
 ble:{n:'Blé',tier:2,target:1},
 poisson:{n:'Poisson',tier:2,target:1},
 amande:{n:'Amande',tier:2,target:1},
 noisette:{n:'Noisette',tier:2,target:1}, sesame:{n:'Sésame',tier:2,target:1}, cajou:{n:'Cajou',tier:2,target:1},
 noix:{n:'Noix',tier:2,target:1}, pistache:{n:'Pistache',tier:2,target:1}, soja:{n:'Soja',tier:2,target:1}, crustaces:{n:'Crustacés',tier:2,target:1},
};

// protocoles d'introduction des allergènes du planning
const PROTO = {
 yaourt:{how:'Yaourt nature au lait de vache entier, sans sucre (pas de lait de vache en boisson avant 1 an).',
   steps:['½ cuillère à café, seul ou dans une purée déjà connue','1 cuillère à café','1 à 2 cuillères à café'],
   keep:'2 à 3 fois par semaine : au goûter, ou une cuillère dans la purée.'},
 semoule:{how:'Semoule fine de blé, cuite dans l\'eau de cuisson des légumes. Gluten : petites quantités les premières semaines.',
   steps:['¼ cuillère à café de semoule cuite dans la purée','½ cuillère à café','1 cuillère à café'],
   keep:'1 fois par semaine minimum (semoule, petites pâtes mixées, croûte de pain plus tard).'},
 oeuf:{how:'Œuf cuit dur (10 min), blanc + jaune écrasés très finement dans la purée. Jamais peu cuit.',
   steps:['Une pointe de cuillère (≈ ¼ c. à café)','½ cuillère à café','1 cuillère à café (≈ 5 g, le maximum avant 6 mois)'],
   keep:'2 fois par semaine. À partir de 6 mois : jusqu\'à ¼ d\'œuf.'},
 arachide:{how:'Beurre de cacahuète 100 % arachide, lisse, sans sel ni sucre, délayé dans un peu d\'eau chaude puis mélangé à la purée. Jamais pur, jamais d\'arachide entière.',
   steps:['¼ cuillère à café délayée','½ cuillère à café','1 cuillère à café'],
   keep:'2 à 3 fois par semaine. Repère LEAP à atteindre progressivement sur plusieurs semaines : ~2 c. à café rases par prise.'},
 poisson:{how:'Poisson blanc (cabillaud, colin, lieu) cuit vapeur, sans arêtes, mixé. Pas d\'espadon, requin ni marlin.',
   steps:['Une pointe de cuillère','½ cuillère à café','1 cuillère à café (≈ 5 g)'],
   keep:'1 à 2 fois par semaine. 10 g max à partir de 6 mois.'},
 amande:{how:'Poudre d\'amande fine ou purée d\'amande 100 %, dans une compote ou un yaourt.',
   steps:['¼ cuillère à café','½ cuillère à café','1 cuillère à café'],
   keep:'1 fois par semaine minimum. Astuce : yaourt + poudre d\'amande = 2 allergènes entretenus d\'un coup.'},
};

// planning des 8 premières semaines
const PLAN = [
 {t:'Découverte en douceur', news:['courgette','brocoli'], alg:null,
  rythme:'3 à 4 jours sur 7, un seul repas (midi ou goûter).',
  qte:'1 à 2 cuillères à café par prise. Purée lisse, sans sel.',
  tips:['Un seul légume par prise, pour qu\'il découvre chaque goût.','Mangez du même légume devant lui, et dites que c\'est bon.','S\'il a très faim, donnez d\'abord un peu de lait.']},
 {t:'Les légumes verts', news:['epinard','poireau'], alg:null,
  rythme:'3 à 4 jours sur 7.',
  qte:'1 à 2 cuillères à café, jusqu\'à 3-4 s\'il en redemande.',
  tips:['Reproposez courgette et brocoli un jour sur deux.','Poireau : uniquement le blanc.']},
 {t:'Premier allergène : le lait', news:['choufleur','navet'], alg:'yaourt',
  rythme:'4 à 5 jours sur 7.',

function schedule(){

    out.push({i,start:d}); d=add(d,7);
  });

  return out;
}
function currentSlot(sch){
  const t=today();
  if(t<sch[0].start) return {k:-1,s:null}; // avant démarrage
  for(let k=0;k<sch.length;k++){ const s=sch[k]; if(s.after) return {k,s}; if(t>=s.start && t<add(s.start,7)) return {k,s}; }
  return {k:-1,s:null}; // avant démarrage
}
function weekFoods(i){
  const base=PLAN[i].news.filter(id=>!((S.settings.removed||{})[i]||[]).includes(id));
  const ex=((S.settings.extra||{})[i]||[]).filter(id=>!base.includes(id));

function entriesOf(id){ return S.entries.filter(e=>e.food===id).sort((a,b)=>(a.date+(a.ts||'')).localeCompare(b.date+(b.ts||''))); }

  const es=entriesOf(id); const f=FMAP[id]||{};
  const n=es.length, aime=es.filter(e=>e.avis==='aime').length, refus=es.filter(e=>e.avis==='refuse').length;
  const rx=es.filter(e=>e.reac==='surveiller'||e.reac==='serieuse');
  const ok=es.filter(e=>e.reac!=='surveiller'&&e.reac!=='serieuse').length;
  const last=n?es[n-1].date:null, first=n?es[0].date:null;
  const lastAime=[...es].reverse().find(e=>e.avis==='aime');
  const lastRef=[...es].reverse().find(e=>e.avis==='refuse');
  let st='todo', label='À tester', cls='';
  if(rx.length){ st='rx'; label= rx.some(e=>e.reac==='serieuse')?'Réaction : en parler au médecin':'Réaction à surveiller'; cls='rx'; }
  else if(f.alg && ok>=3){ st='done'; label='Toléré ✓ ('+ok+' prises)'; cls='done'; }
  else if(!f.alg && aime>=2){ st='done'; label='Acquis ✓'; cls='done'; }
  else if(n && lastRef && (!lastAime || lastRef.date>=lastAime.date) && refus>=1 && aime===0){ st='ref'; label='Refusé '+refus+'/10 · on repropose'; cls='ref'; }
  else if(n){ st='disc'; label= f.alg? 'En introduction ('+ok+'/3)' : 'En découverte ('+n+' fois)'; }
  return {n,aime,refus,ok,last,first,st,label,cls,lastRef};
}
function groupStat(g){
  const es=S.entries.filter(e=>(FMAP[e.food]||{}).alg===g);
  const ok=es.filter(e=>e.reac!=='surveiller'&&e.reac!=='serieuse');
  const rx=es.length-ok.length;
  const dates=es.map(e=>e.date).sort();
  return {n:es.length, ok:ok.length, rx, first:dates[0]||null, last:dates[dates.length-1]||null, es};
}

/* ===== Reprises planifiées & programme jour par jour ===== */
// Règle : semaine d'intro = 2 fois ; S+1 et S+2 = 1 fois ; puis 1 fois toutes les 2 semaines (S+4, S+6…)
const REP_RULE = k => (k===1||k===2) ? 1 : (k>=4 && k%2===0) ? 1 : 0;
const ENT_FOOD = {lait:'yaourt',oeuf:'oeuf',ble:'semoule',arachide:'arachide',poisson:'poisson',amande:'amande'};
const DAYS_BY_WEEK = i => i<=1 ? [0,2,4,6] : i<=3 ? [0,1,3,4,6] : [0,1,2,3,4,5,6];
const ALG_DAYS = n => n===4?[1,2,3]: n===5?[2,3,4]:[1,3,5];
function introWeek(id){ for(let i=0;i<PLAN.length;i++){ if(weekFoods(i).includes(id) || PLAN[i].alg===id) return i; } return -1; }
function weekTargets(i){
  const out=[];
  weekFoods(i).forEach(id=>out.push({id,n:2,kind:'new'}));
  if(PLAN[i].alg) out.push({id:PLAN[i].alg,n:3,kind:'alg'});
  for(let j=0;j<i;j++){
    const k=i-j;
    weekFoods(j).forEach(id=>{ if(stat(id).st==='rx') return; const n=REP_RULE(k); if(n) out.push({id,n,kind:'rep',from:j}); });
    const a=PLAN[j].alg;
    if(a){ const g=FMAP[a].alg; if(groupStat(g).rx) continue; out.push({id:ENT_FOOD[g]||a,n:ALG[g].target,kind:'ent',g}); }
  }
  return out;
}
function dayPlan(i, ws){
  const avail=DAYS_BY_WEEK(i); const days=[0,1,2,3,4,5,6].map(d=>({d,on:avail.includes(d),items:[]}));
  const T=weekTargets(i);
  const algD=ALG_DAYS(avail.length).map(k=>avail[k]);
  const alg=T.find(t=>t.kind==='alg');
  if(alg){ algD.forEach((d,k)=>days[d].items.push({id:alg.id,kind:'alg',k})); }
  // premières découvertes : jours libres d'allergène, au plus tôt
  const news=T.filter(t=>t.kind==='new');
  let free=avail.filter(d=>!(alg&&algD[0]===d));
  news.forEach((t,k)=>{ const d=free[k % free.length]; days[d].items.push({id:t.id,kind:'new',first:true}); });
  const placedDays=id=>days.filter(x=>x.items.some(it=>it.id===id)).map(x=>x.d);
  const place=(t,kind)=>{
    const cand=days.filter(x=>x.on && !x.items.some(it=>it.id===t.id));
    if(!cand.length) return;
    const pd_=placedDays(t.id);
    cand.sort((a,b)=>{
      const sc=x=>x.items.length*3 + (x.items.some(it=>it.first)?3:0) + (x.items.some(it=>it.kind==='alg'&&it.k===0)?2:0) - (pd_.length?Math.min(3,...pd_.map(p=>Math.abs(p-x.d))):0)*2 + x.d*0.01;
      return sc(a)-sc(b);
    });
    cand[0].items.push({id:t.id,kind,g:t.g});
  };
  news.forEach(t=>{ for(let c=1;c<t.n;c++) place(t,'new'); });
  T.filter(t=>t.kind==='ent').forEach(t=>{ for(let c=0;c<t.n;c++) place(t,'ent'); });
  T.filter(t=>t.kind==='rep').forEach(t=>{ for(let c=0;c<t.n;c++) place(t,'rep'); });
  return days.map(x=>({...x,date:add(ws,x.d)}));
}
function slotKey(it){ if(it.kind==='ent') return 'g:'+it.g; if(it.kind==='alg') return 'g:'+FMAP[it.id].alg; return 'f:'+it.id; }
function weekStatus(i, ws){
  const dp=dayPlan(i,ws); const we=add(ws,7);
  const inWeek=S.entries.filter(e=>{const d=pd(e.date);return d>=ws&&d<we;});
  const groups={};
  dp.forEach(x=>x.items.forEach(it=>{ const k=slotKey(it); (groups[k]=groups[k]||[]).push({it,x}); }));
  Object.entries(groups).forEach(([k,slots])=>{
    const es = (k.startsWith('g:') ? inWeek.filter(e=>(FMAP[e.food]||{}).alg===k.slice(2)) : inWeek.filter(e=>e.food===k.slice(2))).map(e=>e.date).sort();
    slots.sort((a,b)=>a.x.d-b.x.d);
    if(slots[0].it.kind==='alg'){ slots.forEach((sl,idx)=>{ sl.it.done = idx<es.length; }); return; }
    const used=es.map(()=>false);
    // 1) même jour  2) rattrapage : un repas noté plus tard couvre le créneau manqué le plus ancien  3) le reste
    slots.forEach(sl=>{ const j=es.findIndex((d,ix)=>!used[ix]&&d===fd(sl.x.date)); if(j>-1){used[j]=true; sl.it.done=true;} else sl.it.done=false; });
    slots.forEach(sl=>{ if(sl.it.done) return; const j=es.findIndex((d,ix)=>!used[ix]&&d>fd(sl.x.date)); if(j>-1){used[j]=true; sl.it.done=true;} });
    slots.forEach(sl=>{ if(sl.it.done) return; const j=used.findIndex(u=>!u); if(j>-1){used[j]=true; sl.it.done=true;} });
  });
  return dp;
}
function eatenOn(id,date,g){
  const ds=fd(date);
  return S.entries.some(e=>e.date===ds && (e.food===id || (g && (FMAP[e.food]||{}).alg===g)));
}
function nextRepriseTxt(id){
  const iw=introWeek(id); if(iw<0) return '';
  const sch=schedule(); const slot=currentSlot(sch); const cur=slot.k===-1?-1:(slot.s.after?PLAN.length:slot.s.i);
  for(let j=Math.max(cur+1,iw+1);j<PLAN.length;j++){ if(REP_RULE(j-iw)){ const s=sch.find(x=>!x.pause&&!x.after&&x.i===j); return `reprise sem. ${j+1} (${frd(s.start)})`; } }
  return '';
}
function dayPlanHtml(i, ws){
  const dp=weekStatus(i,ws); const t=today();
  const label=(it)=>{
    const n=esc(fname(it.id));
    if(it.kind==='alg') return `<b>${n}</b> <span class="pill butter">allergène · prise ${it.k+1}</span> <span class="note">${esc(PROTO[it.id].steps[it.k])}, le matin ou le midi</span>`;
    if(it.kind==='new') return `<b>${n}</b> <span class="pill sage">${it.first?'nouveau':'2e fois'}</span>`;
    if(it.kind==='ent') return `${n} <span class="pill peach">entretien ${esc(ALG[it.g].n.toLowerCase())}</span>`;
    return `${n} <span class="pill">reprise</span>`;
  };
  const rows=dp.map(x=>{
    const dn=frd(x.date,{weekday:'short',day:'numeric'});
    const isT=fd(x.date)===fd(t);
    if(!x.on || !x.items.length) return `<div class="maint" style="opacity:.6"><span style="min-width:62px;text-transform:capitalize">${esc(dn)}</span><span class="note" style="flex:1">Pas de purée : lait seulement</span></div>`;
    return `<div class="maint" style="${isT?'background:#F4F8F1;border-radius:8px;padding-left:6px':''}"><span style="min-width:62px;text-transform:capitalize;font-weight:${isT?600:400}">${esc(dn)}${isT?'<br><span class="note">aujourd\'hui</span>':''}</span><span style="flex:1;display:flex;flex-direction:column;gap:4px">${x.items.map(it=>{const ok=it.done;return `<span data-log="${it.id}" data-date="${fd(x.date)}" style="cursor:pointer">${ok?'✅':'◻️'} ${label(it)}</span>`;}).join('')}</span></div>`;
  }).join('');
  return `<div style="margin-top:14px"><div class="row between"><b>Programme de la semaine</b><span class="note">suggestion, à adapter</span></div>
    <div class="note">Touchez un aliment pour noter le repas : il se coche ✅. Plusieurs aliments le même jour = de petites quantités de chacun.</div>
    <div style="margin-top:6px">${rows}</div>
  </div>`;
}

function observing(){
  const now=Date.now(); const out=[];
  Object.keys(ALG).forEach(g=>{
    const es=groupStat(g).es.slice().sort((a,b)=>(a.date+(a.ts||'')).localeCompare(b.date+(b.ts||'')));
    es.slice(0,3).forEach(e=>{ if(!e.ts) return; const until=new Date(e.ts).getTime()+2*3600e3; if(until>now && e.date===fd(today())) out.push({e,until}); });
  });
  return out;
}
function todayItemRow(it, date, origin){
  const f=FMAP[it.id]; const p=PLAN[0];
  const pill = it.kind==='alg'?`<span class="pill butter">allergène · prise ${it.k+1}</span>`: it.kind==='new'?`<span class="pill sage">${it.first?'nouveau':'2e fois'}</span>`: it.kind==='ent'?`<span class="pill peach">entretien</span>`:`<span class="pill">reprise</span>`;
  const hint = it.kind==='alg' ? PROTO[it.id].steps[it.k]+' · le matin ou le midi' : (f?f.tip:'');
  const ds=fd(today());
  const done = it.done;
  let right;
  if(done){
    const e=S.entries.filter(x=>x.date===ds && (x.food===it.id || (it.kind==='ent'||it.kind==='alg') && (FMAP[x.food]||{}).alg===(it.g||FMAP[it.id].alg))).pop();
    right=`<span class="note">✅ ${e?esc((AVIS[e.avis]||{e:''}).e)+(e.who?' '+esc(e.who):''):'fait'}</span>`;
  } else {
    right=`<span class="row" style="gap:4px">${['aime','bof','refuse'].map(a=>`<button class="btn sm sec" style="padding:6px 8px;font-size:17px" data-quick="${it.id}" data-avis="${a}" title="${AVIS[a].n}">${AVIS[a].e}</button>`).join('')}<button class="btn sm ghost" data-log="${it.id}" title="Plus de détails">⋯</button></span>`;
  }
  return `<div class="maint" style="align-items:flex-start"><span style="flex:1"><b>${esc(fname(it.id))}</b> ${pill}${origin?` <span class="note">· prévu ${esc(origin)}</span>`:''}<br><span class="note">${esc(hint)}</span></span>${right}</div>`;
}
function todayCard(sch,slot){
  const t=today();
  let html='';
  const obs=observing();
  obs.forEach(o=>{ const h=new Date(o.until).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    html+=`<div class="warn" style="margin-bottom:10px"><b>👀 ${esc(fname(o.e.food))} : observez bébé jusqu'à ${h}.</b><br>Plaques, gonflement des lèvres ou du visage, vomissements répétés → on arrête et on appelle le médecin. Gêne pour respirer, malaise, pâleur → 15.</div>`; });
  const who=LS.get('div_who','');
  const whoRow=`<div class="row" style="margin-top:10px;gap:6px"><span class="note">Qui note :</span><input type="text" id="whoQuick" value="${esc(who)}" placeholder="ton prénom" style="width:140px;padding:6px 9px;font-size:14px"></div>`;
  if(slot.k===-1){
    const first=weekStatus(0,sch[0].start).find(x=>x.items.length);
    return html+`<div class="card" style="border-color:#C5CFA0"><div class="kicker">Aujourd'hui</div><h2>On commence ${frd(sch[0].start,{weekday:'long',day:'numeric',month:'long'})}</h2><p class="note" style="margin:6px 0 0">Au programme ce jour-là : ${first.items.map(it=>esc(fname(it.id))).join(', ')}, ${esc(PLAN[0].qte.toLowerCase())}</p>${whoRow}</div>`;
  }
  const s=slot.s;
  if(s.after || s.pause){
    return html+`<div class="card" style="border-color:#C5CFA0"><div class="kicker">Aujourd'hui</div><p style="margin:4px 0">${s.pause?'Semaine de pause : proposez des aliments déjà connus.':'Les 8 semaines sont terminées : on adapte la suite ensemble.'}</p><button class="btn sm sec" data-log="">Noter un repas</button></div>`;
  }
  const dp=weekStatus(s.i,s.start);
  const todayD=dp.find(x=>fd(x.date)===fd(t));
  const missed=[]; dp.filter(x=>x.date<t).forEach(x=>x.items.forEach(it=>{ if(!it.done && it.kind!=='alg') missed.push({it,x}); }));
  const items=(todayD?todayD.items:[]).filter(it=>it.kind!=='alg');
  // allergène : une seule prise par jour, toujours la prochaine dans l'ordre
  const algSlots=[]; dp.forEach(x=>x.items.forEach(it=>{ if(it.kind==='alg') algSlots.push({it,x}); }));
  if(algSlots.length){
    const g=FMAP[algSlots[0].it.id].alg; const gs=groupStat(g);
    const doneToday=gs.es.find(e=>e.date===fd(t));
    const next=algSlots.find(a=>!a.it.done);
    if(doneToday){ const a=algSlots.filter(a=>a.it.done).pop(); if(a) items.unshift({...a.it,done:true}); }
    else if(next && next.x.date<=t && !gs.rx) items.unshift({...next.it,k:algSlots.indexOf(next)});
  }
  let body='';
  if(items.length) body+=items.map(it=>todayItemRow(it,t)).join('');
  else body+=`<p class="note" style="margin:6px 0">Pas de purée prévue aujourd'hui : lait seulement.</p>`;
  if(missed.length){
    body+=`<div style="margin-top:12px"><b>À rattraper</b> <span class="note">· si vous avez le temps, sinon ce n'est pas grave</span></div>`;
    body+=missed.slice(0,4).map(m=>todayItemRow(m.it,t,frd(m.x.date,{weekday:'long'}))).join('');
  }
  const p=PLAN[s.i];
  return html+`<div class="card" style="border-color:#C5CFA0"><div class="row between"><div><div class="kicker">Aujourd'hui · ${esc(frd(t,{weekday:'long',day:'numeric',month:'long'}))}</div></div><span class="note">Sem. ${s.i+1}</span></div>
    <div class="note" style="margin:4px 0 6px"><b>Quantité :</b> ${esc(p.qte)}</div>
    ${body}
    <div class="note" style="margin-top:8px">😋 aime · 😐 mitigé · 🙅 refuse — un geste suffit. ⋯ pour ajouter une réaction ou une note.</div>
    ${whoRow}</div>`;
}


const SOURCES = `<p class="note" style="text-align:center;margin-top:18px">Sources : <a href="https://santepubliquefrance.fr/content/download/766077/4844471?version=1">Santé publique France</a> · <a href="https://www.espghan.org/dam/jcr%3Aea5c9b57-9315-44b7-b9a0-149511b96654/ESPGHAN%20Infant%20Feeding%20Campaign%20-%20Guidance%20Summary.pdf">ESPGHAN</a> · <a href="https://researchnow.flinders.edu.au/en/publications/guidance-for-healthy-complementary-feeding-practices-for-allergy-/">EAACI 2025</a> · <a href="https://eprints.whiterose.ac.uk/143246/">Barends 2019</a> · <a href="https://community.kidswithfoodallergies.org/blog/new-guidelines-for-early-introduction-of-peanut">LEAP</a><br>Cet outil ne remplace pas l'avis de votre pédiatre.</p>`;

function vToday(){
  const sch=schedule(); const slot=currentSlot(sch);
  let html=todayCard(sch,slot);
  const s = slot.k===-1 ? sch[0] : slot.s;
  if(s.after){
    html+=`<div class="card"><h2>La suite, à partir de 6 mois</h2><p class="note">On l'adaptera ensemble début janvier.</p><ul class="tight"><li>Allergènes restants : noisette, sésame, soja, cajou, noix, pistache, crevette (puis céleri, moutarde, mollusques).</li><li>Morceaux à attraper dès qu'il tient assis seul : bâtonnets de patate douce ou de carotte bien cuits, fleurette de brocoli, banane, bâtonnet d'omelette.</li><li>Petits morceaux fondants avant le 5 mars (8 mois).</li><li>Plat familial adapté : on prélève sa part avant de saler.</li></ul></div>`;
  } else if(s.pause){
    html+=`<div class="card"><h2>Semaine de pause</h2><p>Pas de nouveauté : on reprend les aliments connus et on entretient les allergènes. La semaine ${s.i+1} reprendra ensuite.</p><button class="btn sm sec" data-unpause="${s.i}">Annuler la pause</button></div>`;
  } else {
    html+=`<div class="card"><div class="row between"><span class="kicker">${slot.k===-1?'La première semaine':'Cette semaine'} · semaine ${s.i+1}</span></div>${weekDetail(s.i,s.start,slot.k!==-1)}</div>`;
  }
  html+=refus();
  html+=recentLog();
  return html+SOURCES;
}

function recentLog(){
  if(!S.entries.length) return '';
  const list=S.entries.slice().sort((a,b)=>(b.date+(b.ts||'')).localeCompare(a.date+(a.ts||''))).slice(0,15);
  return `<details class="card" style="padding:12px 16px"><summary style="cursor:pointer"><b>Derniers repas notés</b> <span class="note">(pour corriger une erreur)</span></summary>
   ${list.map(e=>{const av=AVIS[e.avis]||{e:'•'}; const rx=REAC[e.reac];
     const bits=[frd(pd(e.date),{weekday:'short',day:'numeric',month:'short'}),e.who?('par '+e.who):'',rx&&e.reac!=='aucune'?rx.n:'',e.note||''].filter(Boolean);
     return `<div class="log"><span class="em">${av.e}</span><div style="flex:1"><b>${esc(e.foodName||fname(e.food))}</b><div class="meta">${bits.map(esc).join(' · ')}</div></div><button class="btn ghost sm" data-del="${esc(e.id)}" title="Supprimer">✕</button></div>`;}).join('')}
  </details>`;
}

/* ---------- PLANNING (2 mois, éditable) ---------- */
const OPENW=new Set();
function setWeekFood(st,i,id,present){
  const inBase=PLAN[i].news.includes(id);
  st.removed[i]=(st.removed[i]||[]).filter(x=>x!==id);
  st.extra[i]=(st.extra[i]||[]).filter(x=>x!==id);
  if(present && !inBase) st.extra[i].push(id);
  if(!present && inBase) st.removed[i].push(id);
}
function editFoods(fn){
  const st={removed:JSON.parse(JSON.stringify(S.settings.removed||{})),extra:JSON.parse(JSON.stringify(S.settings.extra||{}))};
  fn(st); saveSettings(st);
}
function moveFood(i,id,dir){
  const j=i+dir; if(j<0||j>=PLAN.length) return;
  OPENW.add(i); OPENW.add(j);
  editFoods(st=>{ setWeekFood(st,i,id,false); setWeekFood(st,j,id,true); });
}
function vPlanning(){
  const sch=schedule(); const slot=currentSlot(sch); const cur=slot.k===-1?-1:slot.k;
  const st=sch[0].start; const end=add(sch[sch.length-1].start,-1);
  const b=pd(S.settings.birth); const six=b?new Date(b.getFullYear(),b.getMonth()+6,b.getDate()):null;
  const planned=new Set(); PLAN.forEach((p,i)=>weekFoods(i).forEach(id=>planned.add(id)));
  let html=`<div class="card soft"><h2>Les 2 mois</h2><div class="note" style="margin-top:4px">${frd(st,{day:'numeric',month:'long'})} → ${frd(end,{day:'numeric',month:'long'})} · ${planned.size} aliments et ${PLAN.filter(p=>p.alg).length} allergènes. Ouvrez une semaine pour avancer ◀, reculer ▶, retirer ✕ ou ajouter un aliment.</div></div>`;
  sch.forEach((x,k)=>{
    if(x.after){ html+=`<div class="card soft" style="padding:12px 16px"><span class="kicker">À partir du ${frd(x.start)}${six?` · 6 mois le ${frd(six)}`:''}</span><br><b>La suite : on l'adaptera ensemble</b><div class="note">7 allergènes restants, morceaux à attraper, plat familial adapté.</div></div>`; return; }
    if(x.pause){ html+=`<div class="card" style="padding:12px 16px;opacity:.85"><div class="row between"><span><span class="kicker">${frd(x.start)} → ${frd(add(x.start,6))}</span><br><b>⏸ Semaine de pause</b> <span class="note">· aliments connus + entretien</span></span><button class="btn sm ghost" data-unpause="${x.i}">Retirer</button></div></div>`; return; }
    const i=x.i, p=PLAN[i], foods=weekFoods(i), a=ageAt(x.start);
    const tasted=foods.filter(id=>stat(id).n).length; const algOk=p.alg?groupStat(FMAP[p.alg].alg).ok>=3:true;
    const isNow=k===cur, past=cur>-1&&k<cur;
    const status = isNow?'<span class="pill blue">en cours</span>' : past?(tasted===foods.length&&algOk?'<span class="pill sage">✓</span>':'<span class="pill">à finir</span>'):'';
    const flags=[]; const xmas=new Date(x.start.getFullYear(),11,25); if(xmas>=x.start&&xmas<add(x.start,7)) flags.push('🎄 Noël');
    const ny=new Date(x.start.getFullYear()+(x.start.getMonth()===11?1:0),0,1); if(ny>=x.start&&ny<add(x.start,7)) flags.push('🥂 Nouvel An');
    const open = OPENW.has(i);
    const editRows = foods.map(id=>`<div class="maint"><span><b>${esc(fname(id))}</b> <span class="note">${stat(id).n?'· '+esc(stat(id).label):''}</span></span><span class="row" style="gap:2px">
        <button class="btn sm ghost" data-mv="${i}" data-dir="-1" data-id="${id}" ${i===0?'disabled style="opacity:.25"':''} title="Avancer d'une semaine">◀</button>
        <button class="btn sm ghost" data-mv="${i}" data-dir="1" data-id="${id}" ${i===PLAN.length-1?'disabled style="opacity:.25"':''} title="Reculer d'une semaine">▶</button>
        <button class="btn sm ghost" data-wrm="${i}" data-id="${id}" title="Retirer">✕</button></span></div>`).join('');
    const addSel = `<select data-wadd="${i}" style="margin-top:8px"><option value="">＋ Ajouter un aliment à cette semaine…</option>${Object.entries(CATS).filter(([c])=>c!=='alg').map(([c,cn])=>`<optgroup label="${esc(cn)}">${FOODS.filter(f=>f.c===c&&!f.alg&&!foods.includes(f.id)).map(f=>`<option value="${f.id}">${esc(f.n)}${planned.has(f.id)?' (déjà prévu sem. '+(introWeek(f.id)+1)+')':''}</option>`).join('')}</optgroup>`).join('')}</select>`;
    html+=`<details class="week" data-w="${i}" ${open?'open':''} style="${isNow?'border-color:#9FBF97':''}"><summary>
      <span style="flex:1"><span class="kicker">S${i+1} · ${frd(x.start)} → ${frd(add(x.start,6))}${a?' · '+ageTxt(a):''} · ${esc(p.j)}</span><br>
      <b>${foods.map(fname).map(esc).join(', ')||'<span class="note">aucune nouveauté</span>'}</b>${p.alg?` <span class="pill butter">${esc(ALG[FMAP[p.alg].alg].n)}</span>`:''}${flags.length?` <span class="note">${flags.join(' · ')}</span>`:''}</span>${status}</summary>
      <div class="in">
        <div style="margin-top:8px"><b>Nouveautés</b></div>${editRows||'<div class="note">Aucune.</div>'}${addSel}
        ${p.alg?`<div class="note" style="margin-top:10px"><b>Allergène</b> : ${esc(FMAP[p.alg].n)}, 3 prises dans la semaine. L'ordre des allergènes reste fixe (un à la fois, 3 jours d'écart minimum).</div>`:''}
        ${dayPlanHtml(i,x.start)}
        ${(isNow||!past)?`<div style="margin-top:10px"><button class="btn sm ghost" data-pause="${i}">⏸ Insérer une semaine de pause avant celle-ci (tout le reste recule d'une semaine)</button></div>`:''}
      </div></details>`;
  });
  return html+SOURCES;
}

function refus(){
  const t=today();
  const items=FOODS.filter(f=>!f.alg && stat(f.id).st==='ref').map(f=>{const s=stat(f.id); const nx=add(pd(s.lastRef.date),2);
    return {id:f.id,txt: s.refus>=10?'10 essais : faites une pause de quelques semaines':`Essai n°${s.refus+1}${nx>t?` à partir du ${frd(nx)}`:', dès que possible'} · changez la présentation`};});
  if(!items.length) return '';
  return `<div class="card"><h3>Refus à retenter</h3><div class="note">Normal : il faut souvent 8 à 10 essais.</div>
   <div style="margin-top:6px">${items.map(x=>`<div class="maint"><span><b>${esc(fname(x.id))}</b><br><span class="note">${esc(x.txt)}</span></span><button class="btn sm sec" data-log="${x.id}">Noter</button></div>`).join('')}</div></div>`;
}

let FF='tous';
function vFoods(){
  const t=today();
  const filters={tous:'Tous',todo:'À tester',alg:'Allergènes'};
  let html=`<div class="filter">${Object.entries(filters).map(([k,v])=>`<button class="chip ${FF===k?'on':''}" data-ff="${k}">${v}</button>`).join('')}</div>`;
  const tested=FOODS.filter(f=>stat(f.id).n).length;
  html+=`<div class="note" style="margin-bottom:10px">${tested} aliments goûtés sur ${FOODS.length}. Touchez un aliment pour noter une dégustation.</div>`;
  Object.entries(CATS).forEach(([c,cn])=>{
    const list=FOODS.filter(f=>f.c===c).filter(f=>{const s=stat(f.id);
      if(FF==='goute') return s.n>0; if(FF==='todo') return !s.n; if(FF==='ref') return s.st==='ref'; if(FF==='alg') return !!f.alg; return true;});
    if(!list.length) return;
    html+=`<h3 style="margin:14px 0 2px">${esc(cn)}</h3><div class="foods">${list.map(f=>foodCard(f.id,{date:t})).join('')}</div>`;
  });
  const others=[...new Set(S.entries.filter(e=>!FMAP[e.food]).map(e=>e.foodName||e.food))];
  if(others.length && FF!=='alg') html+=`<h3 style="margin:14px 0 2px">Autres aliments notés</h3><div class="note">${others.map(esc).join(', ')}</div>`;
  return html;
}

const mbg=document.getElementById('mbg'), modal=document.getElementById('modal');
function closeModal(){ mbg.classList.remove('show'); modal.innerHTML=''; }
mbg.addEventListener('click',e=>{ if(e.target===mbg) closeModal(); });

let F={};
function openLog(preset, date){
  const sch=schedule(); const slot=currentSlot(sch);
  const wi = slot.s && !slot.s.after && !slot.s.pause ? slot.s.i : (slot.k===-1?0:null);
  const suggested=new Set();
  if(wi!==null){ weekFoods(wi).forEach(id=>suggested.add(id)); if(PLAN[wi].alg) suggested.add(PLAN[wi].alg); }
  FOODS.forEach(f=>{ if(stat(f.id).n) suggested.add(f.id); });
  F={foods:new Set(preset?[preset]:[]), date:date||fd(today()), avis:'', signal:'', qty:'', mode:'cuillere', shared:false, reac:'aucune', note:'', who:LS.get('div_who',''), other:''};
  if(preset) suggested.add(preset);
  F.suggested=[...suggested];
  drawLog();
  mbg.classList.add('show');
}
function chips(group,obj,cur,cls){ return Object.entries(obj).map(([k,v])=>`<button type="button" class="chip ${cur===k?'on '+(typeof v==='object'?v.cls:cls||''):''}" data-set="${group}" data-v="${k}">${esc(typeof v==='object'?(v.e?v.e+' '+v.n:v.n):v)}</button>`).join(''); }
function drawLog(){
  const sug=F.suggested; const rest=FOODS.filter(f=>!sug.includes(f.id));
  const sel=[...F.foods];
  const hasAlgNew = sel.some(id=>{const f=FMAP[id]; return f&&f.alg&&groupStat(f.alg).n===0;});
  modal.innerHTML=`
   <div class="row between"><h2>Noter un repas</h2><button class="btn ghost" data-close>✕</button></div>
   <div class="fld"><span class="lab">Aliment(s) proposé(s)</span>
     <div class="foodpick">${sug.map(id=>`<button type="button" class="chip ${F.foods.has(id)?'on g':''}" data-food="${id}">${esc(fname(id))}</button>`).join('')}</div>
     <select id="addfood" style="margin-top:8px"><option value="">+ Un autre aliment de la liste…</option>${Object.entries(CATS).map(([c,cn])=>`<optgroup label="${esc(cn)}">${rest.filter(f=>f.c===c).map(f=>`<option value="${f.id}">${esc(f.n)}</option>`).join('')}</optgroup>`).join('')}</select>
     <input type="text" id="other" placeholder="…ou un aliment hors liste (ex. : topinambour)" style="margin-top:8px" value="${esc(F.other)}">
   </div>
   ${hasAlgNew?`<div class="info" style="margin-top:10px">Nouvel allergène : de préférence le matin ou le midi, à la maison, et observez bébé pendant 2 heures.</div>`:''}
   <div class="fld"><label for="date">Date</label><input type="date" id="date" value="${F.date}"></div>
   <div class="fld"><span class="lab">Son avis</span><div class="filter">${chips('avis',AVIS,F.avis)}</div></div>
   <div class="fld"><span class="lab">Ses signaux</span><div class="filter">${chips('signal',SIGNAUX,F.signal)}</div></div>
   <div class="fld"><span class="lab">Quantité mangée</span><div class="filter">${chips('qty',QTE,F.qty)}</div></div>
   <div class="fld"><span class="lab">Comment</span><div class="filter">${chips('mode',MODE,F.mode)}</div>
     <label class="check"><input type="checkbox" id="shared" ${F.shared?'checked':''}><span>Repas partagé : on a mangé avec lui</span></label></div>
   <div class="fld"><span class="lab">Réaction</span><div class="filter">${chips('reac',REAC,F.reac)}</div>
     ${F.reac==='serieuse'?`<div class="warn"><b>Arrêtez cet aliment et contactez votre médecin.</b> En cas de gêne pour respirer, de malaise, de pâleur ou de somnolence inhabituelle : appelez le 15.</div>`:''}
     ${F.reac==='surveiller'?`<div class="warn">Ne reproposez pas cet aliment avant d'en avoir parlé au médecin. Une photo des plaques peut aider.</div>`:''}
   </div>
   <div class="fld"><label for="note">Note</label><textarea id="note" placeholder="Préparation, mélange, contexte…">${esc(F.note)}</textarea></div>
   <div class="fld"><label for="who">Qui l'a donné ?</label><input type="text" id="who" placeholder="Ton prénom" value="${esc(F.who)}"></div>
   <div class="row" style="margin-top:18px;justify-content:flex-end"><button class="btn sec" data-close>Annuler</button><button class="btn" id="saveLog">Enregistrer</button></div>`;
}
function captureLog(){
  const g=id=>document.getElementById(id);
  if(!g('date')) return;
  F.date=g('date').value||F.date; F.note=g('note').value; F.who=g('who').value; F.other=g('other').value; F.shared=g('shared').checked;
}
async function saveLog(){
  captureLog();
  const list=[...F.foods]; const other=F.other.trim();
  if(!list.length && !other){ alertBox('Choisissez au moins un aliment.'); return; }
  LS.set('div_who',F.who.trim());
  const base={date:F.date,avis:F.avis||'bof',signal:F.signal,qty:F.qty,mode:F.mode,shared:F.shared,reac:F.reac,note:F.note.trim().slice(0,500),who:F.who.trim().slice(0,40),ts:new Date().toISOString()};
  const items=list.map(id=>({...base,food:id,foodName:fname(id)}));
  if(other) items.push({...base,food:'autre:'+other.toLowerCase().slice(0,60),foodName:other.slice(0,60)});
  closeModal();
  const ids=await addEntries(items);
  toastUndo(ids, items.length>1?`${items.length} aliments notés`:`${items[0].foodName} noté`);
}

function openSettings(){
  const s=S.settings;
  modal.innerHTML=`<div class="row between"><h2>Réglages</h2><button class="btn ghost" data-close>✕</button></div>
   <div class="fld"><label for="sName">Prénom de bébé</label><input type="text" id="sName" value="${esc(s.name)}" placeholder="Prénom"></div>
   <div class="fld"><label for="sBirth">Date de naissance</label><input type="date" id="sBirth" value="${esc(s.birth)}"></div>
   <div class="fld"><label for="sStart">Début de la diversification (un lundi idéalement)</label><input type="date" id="sStart" value="${esc(s.start)}"></div>
   <p class="note">Le planning se recalcule à partir de cette date. ${S.mode==='db'?'Les réglages et le journal sont partagés avec les personnes qui ont accès à cette page.':'Les données sont enregistrées sur cet appareil.'}</p>
   <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn sec" data-close>Annuler</button><button class="btn" id="saveSet">Enregistrer</button></div>`;
  mbg.classList.add('show');
}
function weekRemove(i,id){ OPENW.add(i); editFoods(st=>setWeekFood(st,i,id,false)); }
function weekAdd(i,id){ if(!id) return; OPENW.add(i); editFoods(st=>{ const w=introWeek(id); if(w>-1 && w!==i) setWeekFood(st,w,id,false); setWeekFood(st,i,id,true); }); }

/* ================= ÉVÉNEMENTS ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a,input,[data-log]'); if(!t) return;
  if(t.matches('#tabs a')){ e.preventDefault(); TAB=t.dataset.t; try{history.replaceState(null,'','#'+TAB)}catch(_){location.hash=TAB} render(); window.scrollTo(0,0); return; }
  if(t.id==='fab'){ openLog(null); return; }
  if(t.id==='openSettings'){ openSettings(); return; }
  if(t.dataset.mv!==undefined){ if(t.disabled) return; moveFood(+t.dataset.mv,t.dataset.id,+t.dataset.dir); return; }
  if(t.dataset.quick){ quickLog(t.dataset.quick,t.dataset.avis); return; }
  if(t.dataset.log!==undefined){ openLog(t.dataset.log||null, t.dataset.date); return; }
  if(t.hasAttribute('data-close')){ closeModal(); return; }
  if(t.dataset.food){ captureLog(); const id=t.dataset.food; F.foods.has(id)?F.foods.delete(id):F.foods.add(id); drawLog(); return; }
  if(t.dataset.set){ captureLog(); const k=t.dataset.set; F[k] = (F[k]===t.dataset.v && k!=='mode' && k!=='reac') ? '' : t.dataset.v; drawLog(); return; }
  if(t.id==='saveLog'){ saveLog(); return; }
  if(t.id==='saveSet'){ const g=id=>document.getElementById(id).value; saveSettings({name:g('sName').trim().slice(0,40),birth:g('sBirth'),start:g('sStart')}); closeModal(); return; }
  if(t.dataset.ff){ FF=t.dataset.ff; render(); return; }
  if(t.dataset.pause!==undefined){ const i=+t.dataset.pause; saveSettings({pauses:[...(S.settings.pauses||[]),i]}); return; }
  if(t.dataset.unpause!==undefined){ e.preventDefault(); const i=+t.dataset.unpause; const p=[...(S.settings.pauses||[])]; const k=p.indexOf(i); if(k>-1)p.splice(k,1); saveSettings({pauses:p}); return; }
  if(t.dataset.wrm!==undefined){ weekRemove(+t.dataset.wrm,t.dataset.id); return; }
  if(t.dataset.del){ if(t.dataset.armed){ delEntry(t.dataset.del); } else { t.dataset.armed='1'; t.textContent='Supprimer ?'; t.style.color='var(--red)'; setTimeout(()=>{ if(t.isConnected){ delete t.dataset.armed; t.textContent='✕'; t.style.color=''; } },3000); } return; }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='addfood' && t.value){ captureLog(); F.foods.add(t.value); if(!F.suggested.includes(t.value)) F.suggested.push(t.value); drawLog(); }
  if(t.dataset && t.dataset.wadd!==undefined){ weekAdd(+t.dataset.wadd,t.value); }
});
document.addEventListener('toggle',e=>{ const d=e.target; if(d.matches && d.matches('details.week[data-w]')){ const i=+d.dataset.w; d.open?OPENW.add(i):OPENW.delete(i); } },true);
document.addEventListener('input',e=>{ if(e.target.id==='whoQuick') LS.set('div_who',e.target.value.trim().slice(0,40)); });
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h && h!==TAB){ TAB=h; render(); } });

setInterval(()=>{ if(TAB==='aujourdhui' && document.activeElement?.id!=='whoQuick' && (observing().length || document.querySelector('.warn b'))) render(); },60000);
initStore();
</script>
</body>
</html>
